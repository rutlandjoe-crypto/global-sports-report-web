name: Global Sports Agent Hourly Update

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: read

concurrency:
  group: global-sports-agent-hourly
  cancel-in-progress: true

jobs:
  sports-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Sports site
        uses: actions/checkout@v4
        with:
          path: sports-site

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests python-dotenv feedparser beautifulsoup4 tweepy

      - name: Generate fresh Sports report
        working-directory: sports-site
        shell: pwsh
        env:
          GSR_DISABLE_SOCIAL_POSTS: "1"
          DISTRIBUTION_DISABLE_POSTS: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          $started = (Get-Date).ToUniversalTime()
          python master_runner.py
          if ($LASTEXITCODE -ne 0) {
            throw "Sports report generation failed."
          }

          $status = Get-Content "last_master_runner_status.txt" -Raw -ErrorAction Stop
          if (
            $status -match '(?im)^Pipeline status: FAILED\s*$' -or
            $status -match '(?im)^Required pipeline issues detected in:\s*$'
          ) {
            throw "Required Sports ingestion or generation failed; publication blocked."
          }

          $canonical = Get-Item "public/latest_report.json" -ErrorAction Stop
          if ($canonical.LastWriteTimeUtc -lt $started) {
            throw "Canonical public/latest_report.json was not generated by this run."
          }

          Write-Host "Generated canonical Sports report at public/latest_report.json"

      - name: Validate all six Sports Desks
        working-directory: sports-site
        shell: pwsh
        run: |
          python validate_sports_desks.py

      - name: Validate Sports Agent output
        shell: pwsh
        run: |
          $script = @'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo

          path = "sports-site/public/latest_report.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          site_text = " ".join(str(data.get(k, "")) for k in ["site", "site_name", "vertical", "title"])
          if "sports" not in site_text.lower():
              raise SystemExit(f"Report does not identify as Sports: {site_text}")

          raw = json.dumps(data, ensure_ascii=False)

          banned = [
              "MLB: MLB",
              "NBA: NBA",
              "NHL: NHL",
              "NFL: NFL",
          ]

          found = [term for term in banned if term in raw]
          if found:
              raise SystemExit(f"Sports Agent blocked bad public copy: {found}")

          updated = str(data.get("updated_at") or data.get("generated_at") or "").strip()
          if not updated:
              raise SystemExit("Missing updated_at/generated_at timestamp.")

          formats = [
              "%Y-%m-%d %I:%M:%S %p ET",
              "%Y-%m-%d %I:%M %p ET",
              "%Y-%m-%d %H:%M:%S",
              "%Y-%m-%d %H:%M",
          ]

          parsed = None
          for fmt in formats:
              try:
                  parsed = datetime.strptime(updated, fmt)
                  break
              except ValueError:
                  pass

          if parsed is None:
              raise SystemExit(f"Could not parse Sports timestamp: {updated}")

          eastern = ZoneInfo("America/New_York")
          parsed = parsed.replace(tzinfo=eastern)

          now = datetime.now(eastern)
          age_hours = (now - parsed).total_seconds() / 3600

          if age_hours > 3:
              raise SystemExit(f"Sports report is stale: {age_hours:.2f} hours old.")

          sections = data.get("sections") or {}
          storylines = data.get("key_storylines") or []

          if len(sections) < 5:
              raise SystemExit(f"Too few Sports report sections: {len(sections)}")

          if len(storylines) < 5:
              raise SystemExit(f"Too few Sports report storylines: {len(storylines)}")

          with open("sports-site/public/sports_desks.json", "r", encoding="utf-8") as f:
              desk_payload = json.load(f)

          desks = desk_payload.get("desks", {})
          homepage_cards = desk_payload.get("homepage", {}).get("stories", [])
          if len(homepage_cards) < 5:
              raise SystemExit(f"Too few Sports homepage cards: {len(homepage_cards)}")

          required = {"nfl", "college-football", "mlb", "soccer", "fantasy", "nba"}
          missing = required - set(desks)
          if missing:
              raise SystemExit(f"Missing Sports Desks: {sorted(missing)}")
          for desk_id in required:
              desk = desks[desk_id]
              if len(desk.get("stories", [])) < 3:
                  raise SystemExit(f"Underfilled Sports Desk: {desk_id}")
              if "top-stories" not in desk.get("modules", {}):
                  raise SystemExit(f"Missing primary module: {desk_id}")

          print(
              f"Sports Agent OK: timestamp={updated}, age_hours={age_hours:.2f}, "
              f"sections={len(sections)}, storylines={len(storylines)}, "
              f"homepage_cards={len(homepage_cards)}, desks={len(desks)}"
          )
          '@

          Set-Content -Path validate_sports_agent.py -Value $script -Encoding utf8
          python validate_sports_agent.py

      - name: Publish live Sports data
        shell: pwsh
        env:
          GSR_PUSH_TOKEN: ${{ secrets.GSR_PUSH_TOKEN }}
        run: |
          if (-not $env:GSR_PUSH_TOKEN) {
            throw "GSR_PUSH_TOKEN is not configured."
          }

          $headers = @{ Authorization = "Bearer $env:GSR_PUSH_TOKEN" }
          $report = Invoke-RestMethod `
            -Uri "https://globalsportsreport.com/api/push-report" `
            -Method Post `
            -Headers $headers `
            -ContentType "application/json" `
            -InFile "sports-site/public/latest_report.json"
          $desks = Invoke-RestMethod `
            -Uri "https://globalsportsreport.com/api/push-sports-desks" `
            -Method Post `
            -Headers $headers `
            -ContentType "application/json" `
            -InFile "sports-site/public/sports_desks.json"

          if (-not $report.ok -or -not $desks.ok) {
            throw "Live Sports data publish failed."
          }
          Write-Host "Published live Sports report timestamp $($report.updated_at)"
          Write-Host "Published live Sports desks timestamp $($desks.generated_at)"

