name: Global Sports Live Score Refresh

on:
  workflow_dispatch:
  push:
    branches: ["master"]
    paths:
      - "sports_live_score_refresh.py"
      - "scripts/download_live_sports.mjs"
      - "scripts/publish_live_sports.mjs"
      - ".github/workflows/sports-live-scores.yml"
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read

concurrency:
  group: global-sports-publication
  cancel-in-progress: false

jobs:
  live-scores:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Sports site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install refresh dependencies
        run: |
          python -m pip install requests
          npm ci --ignore-scripts

      - name: Download current live desk payload
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node scripts/download_live_sports.mjs

      - name: Refresh and validate live scoreboards
        run: |
          python sports_live_score_refresh.py
          python validate_sports_desks.py

      - name: Publish live scoreboard payload
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          GSR_PUBLISH_DESKS_ONLY: "1"
        run: node scripts/publish_live_sports.mjs
